name: NESE daily public-site update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
permissions:
  contents: write
concurrency:
  group: nese-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check official sites and press RSS
        run: python scripts/daily.py
      - name: Commit daily discovery data
        run: |
          git config user.name "NESE daily watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/source_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NESE daily discovery"
            git push
          fi
